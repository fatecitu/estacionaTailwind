<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Fatec</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-400">
    <header class="bg-purple-600 text-white p-4">
        <div>
            <h1 class="text-2xl font-bold">🚗Controle de Veículos</h1>
            <p class="text-sm">Estoque do Estacionamento</p>
        </div>
    </header>
    <main class="grid grid-cols-12 gap-4">
        <!-- formulario -->
        <div class="md:col-span-3 col-span-12">
            <section class="bg-white p-5 rounded-lg shadow m-3">
                <h2 class="text-xl font-bold mb-4">Cadastrar Veículo</h2>
                <form id="formVeiculo">
                    <!-- marca -->
                    <div class="mb-4">
                        <label for="marca" class="block mb-1 font-medium">
                            Marca
                        </label>
                        <select id="marca" class="w-full border rounded p-2" required>
                            <option value="">Selecione...</option>
                            <option value="Byd">Byd</option>
                            <option value="Fiat">Fiat</option>
                            <option value="Ford">Ford</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Volkswagen">Volkswagen</option>
                        </select>
                    </div>
                    <!-- modelo -->
                    <div class="mb-4">
                        <label for="modelo" class="block mb-1 font-medium">
                            Modelo
                        </label>
                        <input type="text" id="modelo" class="w-full border rounded p-2" placeholder="Ex: Marea"
                            required />
                        <!-- ano -->
                        <div class="mb-4">
                            <label for="ano" class="block mb-1 font-medium">
                                Ano
                            </label>
                            <input type="number" id="ano" class="w-full border rounded p-2" placeholder="Ex: 1996"
                                required min="1900" max="2030" />
                        </div>
                        <!-- preço -->
                        <div class="mb-4">
                            <label for="preco" class="block mb-1 font-medium">
                                Preço
                            </label>
                            <input type="number" id="preco" class="w-full border rounded p-2" placeholder="Ex: 70000.00"
                                required min="0" step="0.01" />
                        </div>
                        <!-- foto -->
                        <div class="mb-4">
                            <label for="foto" class="block mb-1 font-medium">
                                Foto
                            </label>
                            <input type="file" id="foto" class="w-full border rounded p-2" accept="image/*" />
                        </div>
                        <!-- checkbox -->
                        <div class="mb-4">
                            <input type="checkbox" id="eletrico" />
                            <label for="eletrico">Veículo Elétrico?</label>
                        </div>
                        <!-- botão -->
                        <button type="submit"
                            class="w-full bg-purple-600 text-white p-2 rounded hover:bg-orange-800">Cadastrar</button>
                </form>
            </section>
        </div>
        <!-- tabela -->
        <div class="md:col-span-9 col-span-12">
            <section>
                <table class="w-full text-left mt-4 rounded-lg overflow-hidden pr-4">
                    <thead class="bg-gray-100 text-purple-500">
                        <tr>
                            <th class="p-3">Foto</th>
                            <th class="p-3">Marca</th>
                            <th class="p-3">Modelo</th>
                            <th class="p-3">Preço</th>
                            <th class="p-3">Elétrico</th>
                            <th class="p-3">Opções</th>
                        </tr>
                    </thead>
                    <tbody>
                       <tr class="bg-orange-200 text-black">
                           <td><img src="images/celta.jpg" title="Celta" alt="Celta 2015" class="w-40 rounded"></td>
                           <td>Chevrolet</td>
                           <td>Celta</td>
                           <td>24900,00</td>
                           <td>Não</td>
                           <td></td>
                       </tr>
                       <tr class="bg-purple-400 text-black">
                           <td>
                            <div class="w-40 h-32 rounded bg-gray-200 text-xs flex items-center justify-center">Sem foto</div> 
                           </td>
                           <td>Vw</td>
                           <td>Fusca</td>
                           <td>14700,00</td>
                           <td>Não</td>
                           <td></td>
                       </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>
</body>

</html>
